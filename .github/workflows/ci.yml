name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Windows: the app is Windows-only (native keyboard hook, tray helper, named pipe).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Unit tests only: the smoke and end-to-end tests need a microphone and a desktop session.
      - run: pnpm test
